ANDROID_BUILD_MIN_SDK_VERSION=14
ANDROID_BUILD_TARGET_SDK_VERSION=36
ANDROID_BUILD_SDK_VERSION=36

VERSION_NAME=1.0.7
VERSION_CODE=107

# 以下两项显式覆盖 AGP 默认值，是停留在 support 库模式的必要设置：
# android.nonTransitiveRClass 默认 true（非传递 R 类）；此处退回旧版传递式 R，避免跨模块引用 R 失败
android.nonTransitiveRClass=false
# android.useAndroidX 默认 true（AndroidX）；必须为 false 才能用 com.android.support。
# 注意：本仓库【暂不迁移 AndroidX】，刻意停留在 com.android.support 旧支持库模式。
# 迁移 AndroidX 是后续独立任务（需改包名、改依赖、改 import、升级 AGP），不要在此顺手做。
# 该选项在 AGP 10.0 将被移除，届时只能迁移 AndroidX，无法继续用 support 库。
android.useAndroidX=false